<style>
  :root{--bg:#f8f5ee;--bg2:#efeadf;--panel:#fffdf9;--ink:#5a5248;--ink-dim:#8d8477;--accent:#7f8a6c;
    --line:rgba(127,138,108,.3);--sage:#8a957a;--sage-dk:#6b765a;--gold:#b7a07a;
    --serif:'Cormorant Garamond',Georgia,serif;--script:'Great Vibes',cursive;--sans:'Montserrat',system-ui,sans-serif;}
  body{background:var(--bg);color:var(--ink)}

  /* ===== Ochilish: OQ DANTELLI KONVERT ===== */
  .dn{position:fixed;inset:0;z-index:60;overflow:hidden;cursor:pointer;background:#f1ede4;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  .dn.lit{background:none}
  .dn.gone{pointer-events:none}
  .dn-st{position:absolute;left:0;top:0;width:100%;height:100%;perspective:1500px;perspective-origin:50% 62%;-webkit-perspective:1500px;-webkit-perspective-origin:50% 62%}
  .dn-env{position:absolute;inset:0;background:#efebe2 url('images/konvert.webp') center/100% 100% no-repeat}
  .dn-in{position:absolute;left:0;top:0;width:100%;height:46%;opacity:0;will-change:opacity;
    background:radial-gradient(70% 62% at 50% 36%,#ffffff 0,#fffdf3 42%,#fbf0d2 82%,#f1dfb0 100%);
    -webkit-mask:url('images/qopqoq.webp') center top/100% 106.9% no-repeat;mask:url('images/qopqoq.webp') center top/100% 106.9% no-repeat}
  .dn-glow{position:absolute;left:50%;top:24%;width:60%;height:0;padding-bottom:60%;margin:-30% 0 0 -30%;border-radius:50%;opacity:0;pointer-events:none;will-change:transform,opacity;
    background:radial-gradient(closest-side,#fff 0,rgba(255,252,238,.9) 26%,rgba(255,243,205,.55) 54%,rgba(255,238,190,.18) 80%,rgba(255,236,180,0) 100%)}
  .dn-sh{position:absolute;left:0;top:0;width:100%;height:49.16%;transform-origin:50% 0;opacity:0;pointer-events:none;will-change:transform,opacity;background:#4a3d2c;
    -webkit-mask:url('images/qopqoq.webp') center top/100% 100% no-repeat;mask:url('images/qopqoq.webp') center top/100% 100% no-repeat}
  .dn-flap{position:absolute;left:0;top:0;width:100%;height:49.16%;transform-origin:50% 0;will-change:transform,opacity;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:url('images/qopqoq.webp') center top/100% 100% no-repeat}
  .seal{position:absolute;left:50%;top:44%;z-index:4;width:30%;height:0;padding-bottom:30%;pointer-events:none;
    transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transform:translate(-50%,-50%);animation:sealIdle 4.2s ease-in-out infinite}
  .seal .coin{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
  .seal .coin i{position:absolute;inset:0;background:url('images/muhr.webp') center/contain no-repeat}
  .seal .coin i.edge{filter:brightness(.55)}
  .seal .coin i.face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .seal .coin i.back{backface-visibility:hidden;-webkit-backface-visibility:hidden;filter:brightness(.75)}
  .seal .gloss{position:absolute;inset:0;transform:translateZ(6.5px);backface-visibility:hidden;-webkit-backface-visibility:hidden;
    -webkit-mask:url('images/muhr.webp') center/contain no-repeat;mask:url('images/muhr.webp') center/contain no-repeat;
    background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.6) 47%,rgba(255,255,255,.15) 53%,transparent 68%) 0 0/300% 100%;
    animation:sealGloss 4.2s ease-in-out infinite}
  @keyframes sealGloss{0%,100%{background-position:100% 0}50%{background-position:0 0}}
  @keyframes sealIdle{
    0%,100%{transform:translate(-50%,-50%) rotateY(-16deg) rotateX(7deg) scale(1,1)}
    50%    {transform:translate(-50%,-50%) rotateY(16deg) rotateX(-5deg) scale(1.03,1.03)}}
  .seal-under{position:absolute;left:50%;top:44%;width:27%;height:0;padding-bottom:27%;margin:-12% 0 0 -13.5%;border-radius:50%;pointer-events:none;transition:opacity .5s;
    background:radial-gradient(closest-side,rgba(80,66,48,.38),rgba(80,66,48,0))}
  .dn.go .seal-under{opacity:0}
  .seal-shadow{position:absolute;left:50%;top:calc(44% + 36vh + 14vw);z-index:3;width:26%;height:18px;
    transform:translateX(-50%) scale(.25);border-radius:50%;opacity:0;pointer-events:none;
    background:radial-gradient(closest-side,rgba(80,66,48,.45),rgba(80,66,48,0))}
  .dn-bloom{position:absolute;left:50%;top:26%;width:60vmax;height:60vmax;margin:-30vmax 0 0 -30vmax;border-radius:50%;opacity:0;pointer-events:none;will-change:transform,opacity;
    background:radial-gradient(closest-side,#ffffff 0,#fffefa 30%,rgba(255,250,235,.8) 55%,rgba(255,246,222,0) 100%)}
  .dn-white{position:absolute;inset:0;background:#fffdf8;opacity:0;pointer-events:none;will-change:opacity}
  .dn-hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 9vh);transform:translateX(-50%);z-index:3;padding:10px 18px;border-radius:22px;white-space:nowrap;pointer-events:none;
    background:rgba(255,253,249,.9);border:1px solid rgba(127,138,108,.35);color:var(--sage-dk);
    font-family:var(--sans);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:10.5px;transition:opacity .4s}
  .dn.go .dn-hint{opacity:0}

  /* ===== KONTENT ===== */
  #card{max-width:520px;margin:0 auto;padding:0 22px;text-align:center}
  .sec{padding:46px 0}
  .hero{position:relative;min-height:100vh;min-height:100svh;margin:0 -22px;padding:27vh 17% 0;overflow:hidden;
    background:#f3ede2 url('images/hero.webp') center top/cover no-repeat}
  .hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14%;background:linear-gradient(to bottom,rgba(248,245,238,0),var(--bg));pointer-events:none}
  .hero > *{position:relative;z-index:1}
  .pre{font-family:var(--sans);font-weight:600;letter-spacing:.28em;text-transform:uppercase;font-size:10px;color:var(--sage-dk);line-height:1.8;text-shadow:0 0 8px #fffdf8,0 0 14px #fffdf8}
  .names{margin-top:8px}
  .names .name{display:block;font-family:var(--script);font-weight:400;font-size:clamp(50px,15.5vw,78px);line-height:1.08;color:#6a5d4b;text-shadow:0 0 12px rgba(255,253,248,.95),0 2px 18px rgba(255,253,248,.9)}
  .names .amp{display:block;font-family:var(--script);font-size:clamp(28px,8.5vw,40px);color:var(--sage-dk);line-height:.9}
  .scrolld{position:absolute!important;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);margin:0;color:#5f5243;font-weight:600;opacity:1;text-shadow:0 0 6px #fffdf8,0 0 12px #fffdf8}
  .scrolld .chev{border-color:#5f5243}

  .title{font-family:var(--script);font-weight:400;font-size:clamp(42px,13vw,58px);line-height:1.1;color:#6a5d4b;margin-bottom:6px}
  .sub{font-family:var(--sans);font-weight:500;letter-spacing:.2em;text-transform:uppercase;font-size:10px;color:var(--ink-dim);line-height:1.8;margin-bottom:20px}
  .d-orn{display:block;width:150px;max-width:100%;height:14px;margin:14px auto;color:var(--sage)}

  .scr-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:330px;margin:0 auto}
  .scr{position:relative;height:0;padding-bottom:100%;border-radius:50%;background:#fffdf9;border:1px solid rgba(183,160,122,.55);
    box-shadow:0 8px 20px rgba(120,100,70,.14),inset 0 0 0 4px #fffdf9,inset 0 0 0 5px rgba(183,160,122,.3);overflow:hidden}
  .scr .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;color:#6a5d4b;font-size:clamp(17px,5.4vw,24px);padding:0 4px}
  .scr canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;touch-action:none;cursor:grab;transition:opacity .7s ease}
  .scr.done canvas{opacity:0;pointer-events:none}
  body.no-scratch .scr canvas,body.no-scratch .scr-hint{display:none}
  body.no-scratch .scr-full{max-height:90px;margin-top:20px;opacity:1;transform:none}
  .scr.done .val{animation:valPop .6s cubic-bezier(.2,.9,.3,1.3)}
  @keyframes valPop{from{transform:scale(.8)}to{transform:scale(1)}}
  .scr-full{max-height:0;overflow:hidden;opacity:0;transform:translateY(8px);transition:opacity .8s ease,transform .8s ease,max-height .6s ease,margin-top .6s ease}
  .scr-row.all + .scr-full{max-height:90px;margin-top:20px;opacity:1;transform:none}
  .scr-full .wd{font-family:var(--sans);font-weight:500;letter-spacing:.26em;text-transform:uppercase;font-size:10.5px;color:var(--ink-dim)}
  .scr-full .dt{font-family:var(--serif);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:19px;color:#6a5d4b;margin-top:4px}

  .sage{position:relative;background:var(--sage);border-radius:22px;padding:26px 20px 24px;color:#fffdf8;box-shadow:0 16px 36px rgba(90,100,75,.28)}
  .sage .dove{display:block;width:78%;max-width:300px;height:auto;margin:0 auto}
  .sage .dove.b{transform:scaleY(-1);margin-top:14px;opacity:.9}
  .sage .title{color:#fffdf8;margin:10px 0 8px}
  .lead{font-family:var(--serif);font-style:italic;font-size:20px;line-height:1.55;color:#fffdf8;max-width:27ch;margin:0 auto}
  .note{font-family:var(--serif);font-size:18.5px;line-height:1.55;}
